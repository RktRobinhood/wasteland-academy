# Publishes the site to GitHub Pages on every push to main: the repo as it is, plus
# the Godot web export at next/. Pull requests build the site but don't deploy it.
#
# The takeover switch is the GODOT_AT_ROOT line below (README, "Switching to Godot").
# Off, the site is as above. On, Godot is at the root, the HTML game at classic/, and
# next/ sends people on to the root. scripts/assemble-site.sh lays out both.
#
# The repo goes through actions/jekyll-build-pages, the same step Pages' "deploy
# from a branch" runs, so every URL of the HTML game stays exactly as it was.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The takeover switch: the repository variable GODOT_AT_ROOT, on or off. Unset is off.
  GODOT_AT_ROOT: ${{ vars.GODOT_AT_ROOT || 'off' }}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Before the export, so Jekyll sees only the checkout
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: scripts/ci-install-godot.sh
      - run: ./export.sh "$RUNNER_TEMP/next"
      - name: Lay out the site with the takeover switch ${{ env.GODOT_AT_ROOT }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          scripts/assemble-site.sh _site "$RUNNER_TEMP/next" "$GODOT_AT_ROOT"
          ls -l _site _site/next
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
