# Runs the test net: the HTML game's tests, the Godot project's tests and web export,
# and the takeover dry run. Deployment is in pages.yml.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The telemetry outlier report (FAL-407): standard library only, no install
      - run: python3 -m unittest discover -s tools/telemetry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The suite alone, about 8 minutes (FAL-755) and growing with each AA SL type. The export
  # and the browser shots are the web job: together they went past 25 minutes on main (FAL-721).
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-install-godot.sh
      - run: ./test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-test-logs
          path: _scratch/*.log
          if-no-files-found: ignore
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-install-godot.sh
      - run: ./export.sh
      # Boot the export in headless Chromium at phone and PC sizes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: >-
          node scripts/web-screenshot.mjs build/next web-shots
          'graph-solved=?view=fn-quadratic-features/vertex-from-factorised/graph/midpoint-of-roots/value&seed=3&autoplay=right'
          'table-mcq-wrong=?view=fn-quadratic-from-conditions/a-from-roots-and-point/table/intercept-form-plus-point/mcq&seed=2&autoplay=wrong'
          'fight=?play=quadratics&seed=3'
          'fight-wrong=?play=quadratics&seed=3&autoplay=wrong'
          'fight-summary=?play=quadratics&seed=3&autoplay=lose'
          'floor-select=?play=quadratics&select=1'
          'mini-boss=?play=quadratics&seed=3&fight=5'
          'boss-carry=?play=quadratics&seed=3&fight=10&autoplay=carry'
          'calc-sci=?view=fn-exponential-model/time-to-level/equation/logs-for-unknown/value&seed=2&calc=sci&do=1770/400%3Bln%28Ans%29/0.255%3B400e%5E%280.255%2AAns%29'
          'calc-graph=?view=fn-exponential-model/time-to-level/equation/logs-for-unknown/value&seed=2&calc=graph&y1=400e%5E%280.255x%29&y2=1770&win=-1,10,-300,3000&tool=intersect'
          'study=?study&view=t4-expected-value/fair-stake/words/winnings-vs-cost/value&seed=11'
          'study-wrong=?study&view=t4-expected-value/fair-stake/words/winnings-vs-cost/value&seed=11&autoplay=wrong'
          'explore=?explore'
          'explore-first=?explore&view=fn-quadratic-features/vertex-from-factorised/equation/any/value&seed=7'
          'explore-another-way=?explore&view=fn-quadratic-features/vertex-from-general/equation/any/value&seed=7&autoplay=right'
          'explore-ten=?explore&view=fn-quadratic-from-conditions/a-from-vertex-and-point/graph/any/mcq&seed=12&ten=1'
          'map-world=#world'
          'map-island=#functions'
          'map-region=#functions/quadratics'
          'map-coming-soon=#functions/exp-log'
          'bazaar=?bazaar=demo'
          'bazaar-link=#bazaar'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-web-shots
          path: |
            web-shots/
            _scratch/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The telemetry collector (services/telemetry, FAL-406): a Cloudflare Worker,
  # tested in Cloudflare's local runtime with its own package.json.
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/telemetry
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/telemetry/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The SymPy answer checker, in its own job like the sweep so the godot job keeps its
  # time. About 115,000 questions took 35 minutes in one job, most of it one Python
  # process (FAL-722), and the AA SL rollout adds more, so it runs as six shards side by
  # side (--shard=k/6: every sixth cell and chain, each with all its questions). The
  # limit is the 20 minutes a shard is allowed: past that, add shards.
  answers-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-install-godot.sh
      # pip installs requirements.txt into .venv first.
      - run: tools/check-answers --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-answers-${{ matrix.shard }}
          path: |
            _scratch/check-answers/report.txt
            _scratch/check-answers/summary.json
          if-no-files-found: ignore
          retention-days: 14

  # What a student reads after a wrong answer (FAL-742). Its own job so the godot job
  # keeps its time: about 2.5 minutes inside ./test.sh took that job past its 25.
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-install-godot.sh
      - run: tools/feedback-check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: feedback-check
          path: _scratch/feedback-check.log
          if-no-files-found: ignore
          retention-days: 14

  # The checks only the whole catalogue can pass: every shard ran, every cell has 50
  # questions and every type 1,000. Runs when a shard fails too, because a job that
  # needs a failed job is otherwise skipped, and a skipped check doesn't fail anything.
  answers:
    needs: answers-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.answers-shard.result }}" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: check-answers-*
          path: _scratch/shards
      - run: tools/check-answers --merge _scratch/shards
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-answers
          path: _scratch/check-answers/report.txt
          if-no-files-found: ignore
          retention-days: 14

  # The takeover dry run (README, "Switching to Godot"): the site as Jekyll builds it,
  # laid out with the switch off and on, each checked in Chromium.
  takeover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Before the export, so Jekyll sees only the checkout, as in pages.yml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - run: scripts/ci-install-godot.sh
      - run: ./export.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: tools/takeover-dry-run _site build/next
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: takeover-dry-run
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The seed sweep: every cell with seeds 51 to 2250, past the checker's 1 to 50.
  # Its own job so the godot job keeps its time. About 14 minutes with the Quadratics
  # extension types (FAL-459): main's FAL-415 run was cancelled at 15. About 22 on main
  # before the Exponentials and logs region (FAL-418), which adds 355 cells to 506.
  # The Graphs and key features region (FAL-420) finds every number by root-finding,
  # about ten times the cost of a question elsewhere, so the sweep runs as eight shards
  # side by side (--shard=k/8: every eighth cell and chain), each with every seed. At four
  # shards, two passed the 55-minute cap with E4 and R6 in (FAL-424): past it, add shards.
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-install-godot.sh
      - run: tools/stress-questions --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-questions-${{ matrix.shard }}
          path: _scratch/stress-questions.log
          if-no-files-found: ignore
          retention-days: 14
